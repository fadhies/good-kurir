# Menentukan folder output build untuk Vite
[build]
  publish = "dist"
  command = "npm run build"

# Mengarahkan semua rute API ke backend Base44 (Mencegah Error 404 pada API)
[[redirects]]
  from = "/api/*"
  to = "https://ojol-kita.base44.app/api/:splat" # Ganti jika URL backend Base44 kamu berbeda
  status = 200
  force = true

# Mengarahkan semua rute halaman frontend ke index.html (SPA Fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
